site_name: "Hermes-Agent 源码教程"
site_description: "从入门到精通 —— hermes-agent 系统架构与代码走读"
docs_dir: "tutorial"
site_dir: "site"
theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
plugins:
  - search:
      lang: [zh, en]
      separator: '[\s\u200b\-]'
  - awesome-pages
extra_javascript:
  - javascripts/pager.js

extra_css:
  - stylesheets/custom.css
markdown_extensions:
  - tables
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.superfences
  - pymdownx.arithmatex: {generic: true}
  - admonition
  - pymdownx.details
  - toc: {permalink: true}

site_url: "https://jigangbo.github.io/hermes-agent-tutorial/"
repo_url: "https://github.com/jigangbo/hermes-agent-tutorial"
